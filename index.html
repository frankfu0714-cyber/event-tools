<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Toolkit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%AB%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --text: #111111;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #111111;
    --accent: #111111;
    --accent-soft: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .topbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 32px;
  }
  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    background: var(--surface);
  }
  .lang-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .lang-btn.active {
    background: var(--accent);
    color: #ffffff;
  }
  header.hero { margin-bottom: 48px; }
  header.hero h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  header.hero p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .section { margin-bottom: 48px; }
  .section.tool-hidden { display: none !important; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-head h2 {
    margin: 0;
    margin-right: auto;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .section-head .sub {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
  }
  .tool-remove {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    align-self: center;
    transition: background 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
  }
  .tool-remove:hover {
    background: var(--accent-soft);
    color: var(--text);
  }

  /* Add tool */
  .add-tool {
    position: relative;
    margin-top: 8px;
    margin-bottom: 32px;
    text-align: center;
  }
  .add-tool-menu {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    min-width: 200px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 50;
  }
  .add-tool-item {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .add-tool-item:hover { background: var(--accent-soft); }
  .add-tool-item:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .add-tool-item:disabled:hover { background: transparent; }
  .add-tool-empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 24px 16px 32px;
  }
  .footer-sep { margin: 0 8px; opacity: 0.5; }
  .footer-link {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .footer-link:hover {
    color: var(--text);
    border-bottom-color: var(--text);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type="text"], input[type="number"], input[type="datetime-local"], select {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--border-strong); }
  .btn {
    appearance: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-strong); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .actions {
    display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
  }

  /* Picker */
  .picker-result {
    margin-top: 24px;
    text-align: center;
    padding: 40px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .picker-num {
    font-size: clamp(72px, 18vw, 120px);
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    transform-origin: center;
    position: relative;   /* keep number above the flash overlay */
    z-index: 2;
    transition: color 0.2s ease;
  }
  .picker-num.rolling {
    animation: pick-pop 0.75s cubic-bezier(.18,.9,.25,1.35);
  }
  @keyframes pick-pop {
    0%   { transform: scale(0.45) rotate(-6deg); opacity: 0.2; filter: blur(3px); }
    35%  { transform: scale(1.35) rotate(4deg);  opacity: 1;   filter: blur(0); }
    60%  { transform: scale(0.9)  rotate(-2deg); opacity: 1; }
    80%  { transform: scale(1.06) rotate(1deg);  opacity: 1; }
    100% { transform: scale(1)    rotate(0deg);  opacity: 1; }
  }
  .picker-num.spinning {
    color: var(--muted);
  }
  .picker-num.spinning.bump {
    animation: num-drop 0.16s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes num-drop {
    0%   { transform: translateY(-18px) scale(0.92); opacity: 0.15; filter: blur(1.5px); }
    55%  { transform: translateY(3px)   scale(1.04); opacity: 1;    filter: blur(0);      }
    100% { transform: translateY(0)     scale(1);    opacity: 1; }
  }
  .picker-result.flash::before {
    content: "";
    position: absolute; inset: 0;
    background: var(--accent-soft);
    opacity: 0;   /* base: invisible, so after animation ends it stays out of the way */
    animation: flash 0.75s ease;
    animation-fill-mode: forwards;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes flash {
    0%   { opacity: 0.9; }
    100% { opacity: 0;   }
  }

  /* Picked-list */
  .picked-block {
    margin-top: 24px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .picked-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .picked-head h3 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .picked-count {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .picked-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .picked-empty {
    color: var(--muted);
    font-size: 13px;
  }
  .pick-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .pick-chip.latest {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* Countdown */
  .countdown-display {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 24px;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
  }
  .cd-cell {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 8px;
    text-align: center;
    background: var(--surface);
  }
  .cd-num {
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .cd-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
  }
  .event-title {
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .event-title strong { color: var(--text); font-weight: 500; }
  .cd-status {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    min-height: 18px;
  }
  .cd-status.done { color: var(--text); font-weight: 600; }
  .cd-num.warning { color: #dc2626; }

  /* Poster */
  .poster-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }
  .poster-presets .preset-btn {
    padding: 6px 12px;
    font-size: 13px;
  }
  .poster-overlay {
    position: fixed;
    inset: 0;
    background: var(--text);
    color: var(--bg);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    animation: poster-fade 0.22s ease;
  }
  @keyframes poster-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .poster-text {
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.05;
    padding: 0 5vw;
    max-width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    user-select: none;
  }
  .poster-close {
    position: absolute;
    top: 22px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    color: inherit;
    border: 0;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .poster-close:hover { background: rgba(255, 255, 255, 0.2); }
  .poster-hint {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    opacity: 0.45;
    letter-spacing: 0.04em;
  }

  /* Notes */
  .notes-textarea {
    width: 100%;
    min-height: 180px;
    padding: 14px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.55;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s;
  }
  .notes-textarea:focus { border-color: var(--border-strong); }
  .notes-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .notes-saved {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .notes-saved::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #16a34a;
  }
  .notes-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 900;
    display: flex;
    flex-direction: column;
    padding: 18px 24px 24px;
    animation: poster-fade 0.18s ease;
  }
  .notes-overlay-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  .notes-overlay-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .notes-overlay-meta {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }
  .notes-overlay textarea {
    flex: 1;
    width: 100%;
    padding: 20px 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    line-height: 1.65;
    outline: none;
    resize: none;
    transition: border-color 0.15s;
  }
  .notes-overlay textarea:focus { border-color: var(--border-strong); }
  .notes-min {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .notes-min:hover { border-color: var(--border-strong); }

  /* Font size controls */
  .size-ctrl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .size-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    width: 26px;
    height: 24px;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .size-btn:hover { border-color: var(--border-strong); }
  .size-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .size-readout {
    font-size: 11px;
    color: var(--muted);
    min-width: 36px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .poster-size-ctrl {
    position: absolute;
    bottom: 22px;
    right: 24px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 2;
  }
  .poster-size-ctrl .size-btn {
    background: rgba(255, 255, 255, 0.1);
    color: inherit;
    border: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 600;
  }
  .poster-size-ctrl .size-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  .poster-size-ctrl .size-readout {
    color: inherit;
    opacity: 0.6;
    font-size: 12px;
    min-width: 38px;
  }

  .hidden { display: none !important; }

  footer {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
  }

  @media (max-width: 480px) {
    .container { padding: 32px 18px 48px; }
    .cd-cell { padding: 18px 6px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="lang-switch" role="tablist" aria-label="Language">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中</button>
      </div>
    </div>

    <header class="hero">
      <h1 data-i18n="title">Event Toolkit</h1>
      <p data-i18n="tagline">A minimal number picker and countdown timer.</p>
    </header>

    <!-- NUMBER PICKER (top) -->
    <div id="tools-host"></div>

    <!-- COUNTDOWN (below) -->
<!-- POSTER -->
<!-- NOTES -->
<div class="add-tool-empty hidden" id="add-tool-empty" data-i18n="no_tools_hint">No tools yet. Add one below.</div>

    <div class="add-tool" id="add-tool">
      <button class="btn btn-ghost" id="add-tool-btn" type="button" data-i18n="add_tool_btn">+ Add tool</button>
      <div class="add-tool-menu hidden" id="add-tool-menu" role="menu">
        <button class="add-tool-item" data-add-tool="picker" type="button" data-i18n="picker_heading">Number Picker</button>
        <button class="add-tool-item" data-add-tool="countdown" type="button" data-i18n="cd_heading">Countdown</button>
        <button class="add-tool-item" data-add-tool="poster" type="button" data-i18n="poster_heading">Poster</button>
        <button class="add-tool-item" data-add-tool="notes" type="button" data-i18n="notes_heading">Notes</button>
      </div>
    </div>

    <footer>
      <span data-i18n="footer">No tracking, no ads, works offline.</span>
      <span class="footer-sep">·</span>
      <a class="footer-link" href="mailto:goldotakutw@gmail.com?subject=Event%20Toolkit%20feedback" data-i18n="feedback_link">Send feedback</a>
    </footer>
  </div>

  <!-- POSTER OVERLAY -->
  <div id="ps-overlay" class="poster-overlay hidden" role="dialog" aria-modal="true">
    <button class="poster-close" id="ps-close" aria-label="Close" type="button">×</button>
    <div class="poster-text" id="ps-display"></div>
    <div class="poster-size-ctrl" aria-label="Font size">
      <button class="size-btn" id="ps-size-down" type="button" title="Smaller">A−</button>
      <span class="size-readout" id="ps-size-readout">100%</span>
      <button class="size-btn" id="ps-size-up" type="button" title="Larger">A+</button>
    </div>
    <div class="poster-hint" data-i18n="poster_hint">Press ESC or click anywhere to close</div>
  </div>

  <!-- NOTES OVERLAY -->
  <div id="nt-overlay" class="notes-overlay hidden" role="dialog" aria-modal="true">
    <div class="notes-overlay-head">
      <h2 data-i18n="notes_heading">Notes</h2>
      <span class="notes-overlay-meta"><span id="nt-count-max">0</span> <span data-i18n="chars">characters</span></span>
      <div class="size-ctrl" aria-label="Font size">
        <button class="size-btn" id="nt-size-down-max" type="button" title="Smaller">A−</button>
        <span class="size-readout" id="nt-size-readout-max">14px</span>
        <button class="size-btn" id="nt-size-up-max" type="button" title="Larger">A+</button>
      </div>
      <button class="notes-min" id="nt-min" type="button" data-i18n="minimize_btn">Minimize</button>
    </div>
    <textarea id="nt-text-max" data-i18n-placeholder="notes_ph" placeholder="Type your notes here…"></textarea>
  </div>

  <template id="tpl-picker"><section class="section" data-tool="picker">
      <div class="section-head">
        <h2 data-i18n="picker_heading">Number Picker</h2>
        <p class="sub" data-i18n="picker_sub">Random pick in a range.</p>
        <button class="tool-remove" type="button" data-i18n-title="remove_tool_title" title="Remove">×</button>
      </div>

      <div class="row">
        <div>
          <label for="pk-min" data-i18n="min">Minimum</label>
          <input id="pk-min" data-role="pk-min" type="number" value="1" />
        </div>
        <div>
          <label for="pk-max" data-i18n="max">Maximum</label>
          <input id="pk-max" data-role="pk-max" type="number" value="100" />
        </div>
        <div>
          <label for="pk-unique" data-i18n="unique_label">Repeats</label>
          <select id="pk-unique" data-role="pk-unique">
            <option value="no" data-i18n="allow_repeats">Allow repeats</option>
            <option value="yes" data-i18n="no_repeats">No repeats</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="pk-pick" data-role="pk-pick" data-i18n="pick_btn">Pick a number</button>
        <button class="btn btn-ghost" id="pk-undo" data-role="pk-undo" data-i18n="undo_btn" disabled>Undo</button>
        <button class="btn btn-ghost" id="pk-clear" data-role="pk-clear" data-i18n="clear_btn">Clear all</button>
      </div>

      <div class="picker-result" id="pk-result" data-role="pk-result">
        <div class="picker-num" id="pk-num" data-role="pk-num">&mdash;</div>
      </div>

      <div class="picked-block">
        <div class="picked-head">
          <h3 data-i18n="picked_heading">Picked so far</h3>

<script>
(function () {
  "use strict";

  // ---------- i18n ----------
  const I18N = {

      preset_qa: "問與答",

      poster_hint: "按 ESC 或點擊任意處關閉",

      notes_sub: "活動現場的記事本。",
      notes_ph: "在此輸入備忘…",
      maximize_btn: "放大",
      minimize_btn: "縮小",
      notes_clear_btn: "清除",
      chars: "字元",
      saved_locally: "已儲存在此裝置",
      confirm_clear_notes: "確定要清除全部備忘？",
      add_tool_btn: "+ 新增工具",
      remove_tool_title: "移除工具",
      no_tools_hint: "目前沒有工具，請於下方新增。",
      feedback_link: "意見回饋",
      footer: "無追蹤、無廣告、可離線使用。",
    }
  };

  let currentLang = "en";

  function t(key, vars) {
    let s = (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
    if (vars) Object.keys(vars).forEach(k => { s = s.replace("{" + k + "}", vars[k]); });
    return s;
  }

  function applyLangToTree(root) {
    root.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    root.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
      el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
    });
    root.querySelectorAll("[data-i18n-title]").forEach(el => {
      el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
    });
  }

  function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.title = t("title");
    applyLangToTree(document);
    document.querySelectorAll(".lang-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    instances.forEach(inst => { if (inst.onLangChange) inst.onLangChange(); });
  }

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
  });

  // ---------- Audio (beep) ----------
  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        audioCtx = new Ctor();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  function playBeepSequence() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const base = ctx.currentTime + 0.02;
    const beeps = [
      { at: 0.00, freq: 880, dur: 0.18 },
      { at: 0.28, freq: 880, dur: 0.18 },
      { at: 0.56, freq: 1175, dur: 0.42 },
    ];
    beeps.forEach(b => {
      const t0 = base + b.at;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(b.freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.25, t0 + 0.01);
      gain.gain.linearRampToValueAtTime(0.22, t0 + b.dur - 0.04);
      gain.gain.linearRampToValueAtTime(0, t0 + b.dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + b.dur + 0.02);
    });
  }

  // ---------- Poster overlay (singleton) ----------
  const psOverlay = document.getElementById("ps-overlay");
  const psClose = document.getElementById("ps-close");
  const psDisplay = document.getElementById("ps-display");
  const psSizeDown = document.getElementById("ps-size-down");
  const psSizeUp = document.getElementById("ps-size-up");
  const psSizeReadout = document.getElementById("ps-size-readout");

  const PS_SCALE_KEY = "event-tools-poster-scale-v1";
  let psScale = (function () {
    try {
      const v = parseFloat(localStorage.getItem(PS_SCALE_KEY));
      if (Number.isFinite(v) && v >= 0.4 && v <= 2.0) return v;
    } catch (e) {}
    return 1.0;
  })();
  function applyPosterScale() {
    if (psSizeReadout) psSizeReadout.textContent = Math.round(psScale * 100) + "%";
    if (psSizeDown) psSizeDown.disabled = psScale <= 0.5 + 0.001;
    if (psSizeUp) psSizeUp.disabled = psScale >= 1.5 - 0.001;
    try { localStorage.setItem(PS_SCALE_KEY, String(psScale)); } catch (e) {}
  }
  function bumpPosterScale(delta) {
    const next = Math.max(0.5, Math.min(1.5, Math.round((psScale + delta) * 10) / 10));
    if (next === psScale) return;
    psScale = next;
    applyPosterScale();
    if (!psOverlay.classList.contains("hidden")) fitPosterText();
  }
  applyPosterScale();

  function fitPosterText() {
    if (!psDisplay) return;
    const W = window.innerWidth;
    const H = window.innerHeight;
    const maxW = W * 0.9;
    const maxH = H * 0.78;
    let size = Math.min(W * 0.9, H * 0.6) * psScale;
    psDisplay.style.fontSize = size + "px";
    let safety = 80;
    while (safety-- > 0 &&
           (psDisplay.scrollWidth > maxW || psDisplay.scrollHeight > maxH) &&
           size > 14) {
      size *= 0.9;
      psDisplay.style.fontSize = size + "px";
    }
  }
  function showPoster(text) {
    const txt = (text == null ? "" : String(text)).trim() || t("default_poster");
    psDisplay.textContent = txt;
    psOverlay.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(fitPosterText);
  }
  function hidePoster() {
    psOverlay.classList.add("hidden");
    document.body.style.overflow = "";
  }
  if (psClose) psClose.addEventListener("click", (e) => { e.stopPropagation(); hidePoster(); });
  if (psOverlay) psOverlay.addEventListener("click", () => hidePoster());
  document.addEventListener("keydown", (e) => {
    if (psOverlay && e.key === "Escape" && !psOverlay.classList.contains("hidden")) hidePoster();
  });
  window.addEventListener("resize", () => {
    if (psOverlay && !psOverlay.classList.contains("hidden")) fitPosterText();
  });
  if (psSizeDown) psSizeDown.addEventListener("click", (e) => { e.stopPropagation(); bumpPosterScale(-0.1); });
  if (psSizeUp) psSizeUp.addEventListener("click", (e) => { e.stopPropagation(); bumpPosterScale(0.1); });

  // ---------- Notes overlay + shared font size (singleton) ----------
  const ntOverlay = document.getElementById("nt-overlay");
  const ntTextMax = document.getElementById("nt-text-max");
  const ntMinBtn = document.getElementById("nt-min");
  const ntCountMax = document.getElementById("nt-count-max");
  const ntSizeDownMax = document.getElementById("nt-size-down-max");
  const ntSizeUpMax = document.getElementById("nt-size-up-max");
  const ntSizeReadoutMax = document.getElementById("nt-size-readout-max");

  const NT_SIZE_KEY = "event-tools-notes-size-v1";
  let ntFontSize = (function () {
    try {
      const v = parseInt(localStorage.getItem(NT_SIZE_KEY), 10);
      if (Number.isFinite(v) && v >= 12 && v <= 28) return v;
    } catch (e) {}
    return 14;
  })();
  // Tracked notes mounts so size changes propagate to all of them
  const noteMounts = [];
  let activeNote = null;

  function applyNotesSize() {
    const label = ntFontSize + "px";
    if (ntTextMax) ntTextMax.style.fontSize = ntFontSize + "px";
    if (ntSizeReadoutMax) ntSizeReadoutMax.textContent = label;
    const atMin = ntFontSize <= 12;
    const atMax = ntFontSize >= 28;
    if (ntSizeDownMax) ntSizeDownMax.disabled = atMin;
    if (ntSizeUpMax) ntSizeUpMax.disabled = atMax;
    noteMounts.forEach(m => {
      m.textareaEl.style.fontSize = ntFontSize + "px";
      if (m.sizeReadoutEl) m.sizeReadoutEl.textContent = label;
      if (m.sizeDownBtn) m.sizeDownBtn.disabled = atMin;
      if (m.sizeUpBtn) m.sizeUpBtn.disabled = atMax;
    });
    try { localStorage.setItem(NT_SIZE_KEY, String(ntFontSize)); } catch (e) {}
  }
  function bumpNotesSize(delta) {
    const next = Math.max(12, Math.min(28, ntFontSize + delta));
    if (next === ntFontSize) return;
    ntFontSize = next;
    applyNotesSize();
  }
  function showNotesMax(mount) {
    activeNote = mount;
    if (ntTextMax) ntTextMax.value = mount.textareaEl.value;
    if (ntCountMax) ntCountMax.textContent = String(mount.textareaEl.value.length);
    ntOverlay.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => {
      if (!ntTextMax) return;
      ntTextMax.focus();
      const len = ntTextMax.value.length;
      try { ntTextMax.setSelectionRange(len, len); } catch (e) {}
    });
  }
  function hideNotesMax() {
    if (activeNote && ntTextMax) {
      activeNote.textareaEl.value = ntTextMax.value;
      activeNote.save(ntTextMax.value);
      if (activeNote.countEl) activeNote.countEl.textContent = String(ntTextMax.value.length);
    }
    ntOverlay.classList.add("hidden");
    document.body.style.overflow = "";
    activeNote = null;
  }
  if (ntMinBtn) ntMinBtn.addEventListener("click", hideNotesMax);
  if (ntTextMax) ntTextMax.addEventListener("input", () => {
    if (!activeNote) return;
    const v = ntTextMax.value;
    activeNote.textareaEl.value = v;
    activeNote.save(v);
    if (activeNote.countEl) activeNote.countEl.textContent = String(v.length);
    if (ntCountMax) ntCountMax.textContent = String(v.length);
  });
  document.addEventListener("keydown", (e) => {
    if (ntOverlay && e.key === "Escape" && !ntOverlay.classList.contains("hidden")) hideNotesMax();
  });
  if (ntSizeDownMax) ntSizeDownMax.addEventListener("click", () => bumpNotesSize(-2));
  if (ntSizeUpMax) ntSizeUpMax.addEventListener("click", () => bumpNotesSize(2));
  applyNotesSize();

  // ---------- Per-tool mount functions ----------
  const TOOL_TYPES = ["picker", "countdown", "poster", "notes"];
  const instances = [];

  function mountPicker(section) {
    const pkMin = section.querySelector('[data-role="pk-min"]');
    const pkMax = section.querySelector('[data-role="pk-max"]');
    const pkUnique = section.querySelector('[data-role="pk-unique"]');
    const pkPick = section.querySelector('[data-role="pk-pick"]');
    const pkUndo = section.querySelector('[data-role="pk-undo"]');
    const pkClear = section.querySelector('[data-role="pk-clear"]');
    const pkNum = section.querySelector('[data-role="pk-num"]');
    const pkResult = section.querySelector('[data-role="pk-result"]');
    const pkList = section.querySelector('[data-role="pk-list"]');
    const pkCount = section.querySelector('[data-role="pk-count"]');

    const history = [];
    let pkRolling = false;

    function renderPicked() {
      pkCount.textContent = String(history.length);
      if (history.length === 0) {
        pkList.innerHTML = '<span class="picked-empty">' + t("no_picks") + '</span>';
        pkUndo.disabled = true;
        return;
      }
      pkUndo.disabled = false;
      const lastIdx = history.length - 1;
      pkList.innerHTML = history
        .map((n, i) => '<span class="pick-chip' + (i === lastIdx ? ' latest' : '') + '">' + n + '</span>')
        .join("");
    }

    function triggerPickAnim() {
      pkNum.classList.remove("rolling");
      pkResult.classList.remove("flash");
      void pkNum.offsetWidth;
      pkNum.classList.add("rolling");
      pkResult.classList.add("flash");
    }

    function rollAndReveal(finalPick, lo, hi) {
      if (pkRolling) return;
      pkRolling = true;
      pkPick.disabled = true;
      pkUndo.disabled = true;
      pkClear.disabled = true;
      const range = hi - lo + 1;
      const totalDuration = 1700;
      const startInterval = 32;
      const endInterval = 320;
      const startTime = performance.now();
      pkNum.classList.remove("rolling", "bump");
      pkResult.classList.remove("flash");
      pkNum.classList.add("spinning");
      function randomOther(exclude) {
        if (range <= 1) return lo;
        let n;
        do { n = Math.floor(Math.random() * range) + lo; } while (n === exclude);
        return n;
      }
      let last = null;
      function step() {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(1, elapsed / totalDuration);
        if (progress >= 1) {
          pkNum.classList.remove("spinning", "bump");
          pkNum.textContent = String(finalPick);
          void pkNum.offsetWidth;
          pkNum.classList.add("rolling");
          pkResult.classList.add("flash");
          history.push(finalPick);
          renderPicked();
          pkRolling = false;
          pkPick.disabled = false;
          pkClear.disabled = false;
          return;
        }
        const eased = Math.pow(progress, 4);
        const interval = startInterval + (endInterval - startInterval) * eased;
        last = randomOther(last);
        pkNum.classList.remove("bump");
        void pkNum.offsetWidth;
        pkNum.textContent = String(last);
        pkNum.classList.add("bump");
        setTimeout(step, interval);
      }
      step();
    }

    pkPick.addEventListener("click", () => {
      if (pkRolling) return;
      const min = parseInt(pkMin.value, 10);
      const max = parseInt(pkMax.value, 10);
      if (!Number.isFinite(min) || !Number.isFinite(max)) {
        pkNum.textContent = "?";
        return;
      }
      const lo = Math.min(min, max);
      const hi = Math.max(min, max);
      const range = hi - lo + 1;
      let pick;
      if (pkUnique.value === "yes") {
        const used = new Set(history);
        if (used.size >= range) {
          pkNum.textContent = "✓";
          return;
        }
        do {
          pick = Math.floor(Math.random() * range) + lo;
        } while (used.has(pick));
      } else {
        pick = Math.floor(Math.random() * range) + lo;
      }
      ensureAudio();
      rollAndReveal(pick, lo, hi);
    });

    pkUndo.addEventListener("click", () => {
      if (pkRolling) return;
      if (history.length === 0) return;
      history.pop();
      if (history.length === 0) {
        pkNum.textContent = "—";
        pkNum.classList.remove("rolling", "spinning", "bump");
        pkResult.classList.remove("flash");
      } else {
        pkNum.textContent = String(history[history.length - 1]);
        pkNum.classList.remove("spinning", "bump");
        triggerPickAnim();
      }
      renderPicked();
    });

    pkClear.addEventListener("click", () => {
      if (pkRolling) return;
      history.length = 0;
      pkNum.textContent = "—";
      pkNum.classList.remove("rolling", "spinning", "bump");
      pkResult.classList.remove("flash");
      renderPicked();
    });

    renderPicked();

    return { onLangChange: renderPicked };
  }

  function mountCountdown(section) {
    const cdTitle = section.querySelector('[data-role="cd-title"]');
    const cdMinsIn = section.querySelector('[data-role="cd-mins-in"]');
    const cdSecsIn = section.querySelector('[data-role="cd-secs-in"]');
    const cdStart = section.querySelector('[data-role="cd-start"]');
    const cdPause = section.querySelector('[data-role="cd-pause"]');
    const cdReset = section.querySelector('[data-role="cd-reset"]');
    const cdOutput = section.querySelector('[data-role="cd-output"]');
    const cdShowTitle = section.querySelector('[data-role="cd-show-title"]');
    const cdStatus = section.querySelector('[data-role="cd-status"]');
    const cdMinsEl = section.querySelector('[data-role="cd-mins"]');
    const cdSecsEl = section.querySelector('[data-role="cd-secs"]');

    function pad2(n) { return String(n).padStart(2, "0"); }

    let cdTimer = null;
    let cdRemaining = 0;
    let cdEndAt = 0;
    let cdStarted = false;
    let cdPaused = false;

    function renderRemaining(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      cdMinsEl.textContent = pad2(m);
      cdSecsEl.textContent = pad2(s);
      const lowTime = totalSec <= 10 && totalSec > 0;
      cdMinsEl.classList.toggle("warning", lowTime);
      cdSecsEl.classList.toggle("warning", lowTime);
    }

    function tickCountdown() {
      const now = Date.now();
      const diff = cdEndAt - now;
      if (diff <= 0) {
        renderRemaining(0);
        cdStatus.textContent = t("its_time");
        cdStatus.classList.add("done");
        clearInterval(cdTimer);
        cdTimer = null;
        cdPause.disabled = true;
        cdRemaining = 0;
        playBeepSequence();
        return;
      }
      renderRemaining(diff);
    }

    cdStart.addEventListener("click", () => {
      ensureAudio();
      const mins = parseInt(cdMinsIn.value, 10) || 0;
      const secs = parseInt(cdSecsIn.value, 10) || 0;
      const totalMs = (mins * 60 + secs) * 1000;
      if (totalMs <= 0) {
        cdOutput.classList.remove("hidden");
        cdStatus.classList.remove("done");
        cdStatus.textContent = t("pick_time");
        return;
      }
      cdRemaining = totalMs;
      cdEndAt = Date.now() + totalMs;
      cdStarted = true;
      cdPaused = false;
      cdShowTitle.textContent = cdTitle.value.trim() || t("default_event");
      cdStatus.classList.remove("done");
      cdStatus.textContent = "";
      cdOutput.classList.remove("hidden");
      renderRemaining(totalMs);
      if (cdTimer) clearInterval(cdTimer);
      cdTimer = setInterval(tickCountdown, 250);
      cdPause.disabled = false;
      cdPause.textContent = t("pause_btn");
    });

    cdPause.addEventListener("click", () => {
      if (!cdStarted) return;
      if (cdTimer) {
        clearInterval(cdTimer);
        cdTimer = null;
        cdRemaining = Math.max(0, cdEndAt - Date.now());
        cdPaused = true;
        cdPause.textContent = t("resume_btn");
      } else if (cdRemaining > 0) {
        cdEndAt = Date.now() + cdRemaining;
        cdTimer = setInterval(tickCountdown, 250);
        cdPaused = false;
        cdPause.textContent = t("pause_btn");
      }
    });

    cdReset.addEventListener("click", () => {
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
      cdStarted = false;
      cdPaused = false;
      cdRemaining = 0;
      cdEndAt = 0;
      cdOutput.classList.add("hidden");
      cdStatus.classList.remove("done");
      cdStatus.textContent = "";
      cdMinsEl.classList.remove("warning");
      cdSecsEl.classList.remove("warning");
      cdPause.disabled = true;
      cdPause.textContent = t("pause_btn");
    });

    return {
      onLangChange() {
        if (cdPaused && cdTimer === null && cdRemaining > 0 && cdStarted) {
          cdPause.textContent = t("resume_btn");
        } else {
          cdPause.textContent = t("pause_btn");
        }
        if (cdStarted) {
          cdShowTitle.textContent = cdTitle.value.trim() || t("default_event");
          if (cdStatus.classList.contains("done")) cdStatus.textContent = t("its_time");
        }
      },
      cleanup() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
    };
  }

  function mountPoster(section) {
    const psText = section.querySelector('[data-role="ps-text"]');
    const psShow = section.querySelector('[data-role="ps-show"]');
    psShow.addEventListener("click", () => showPoster(psText.value));
    psText.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        showPoster(psText.value);
      }
    });
    section.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = "preset_" + btn.dataset.preset;
        showPoster(t(key));
      });
    });
    return {};
  }

  function mountNotes(section, iid) {
    const ntText = section.querySelector('[data-role="nt-text"]');
    const ntCount = section.querySelector('[data-role="nt-count"]');
    const ntMaxBtn = section.querySelector('[data-role="nt-max"]');
    const ntClearBtn = section.querySelector('[data-role="nt-clear"]');
    const ntSizeDown = section.querySelector('[data-role="nt-size-down"]');
    const ntSizeUp = section.querySelector('[data-role="nt-size-up"]');
    const ntSizeReadout = section.querySelector('[data-role="nt-size-readout"]');

    const NT_KEY = "event-tools-notes-content-" + iid;
    function loadNotes() {
      try { return localStorage.getItem(NT_KEY) || ""; }
      catch (e) { return ""; }
    }
    function saveNotes(v) {
      try { localStorage.setItem(NT_KEY, v); } catch (e) {}
    }
    // One-time migration: copy v1 singleton key to first notes instance that has no content.
    let initial = loadNotes();
    if (!initial) {
      try {
        const legacy = localStorage.getItem("event-tools-notes-v1");
        if (legacy && !localStorage.getItem("event-tools-notes-v1-migrated")) {
          initial = legacy;
          saveNotes(legacy);
          localStorage.setItem("event-tools-notes-v1-migrated", "1");
        }
      } catch (e) {}
    }
    ntText.value = initial;
    ntCount.textContent = String(initial.length);

    ntText.addEventListener("input", () => {
      const v = ntText.value;
      ntCount.textContent = String(v.length);
      saveNotes(v);
      // If this instance is the active maximized one, mirror to overlay
      if (activeNote && activeNote.iid === iid && ntTextMax) {
        ntTextMax.value = v;
        if (ntCountMax) ntCountMax.textContent = String(v.length);
      }
    });

    const mountObj = {
      iid: iid,
      textareaEl: ntText,
      countEl: ntCount,
      sizeReadoutEl: ntSizeReadout,
      sizeDownBtn: ntSizeDown,
      sizeUpBtn: ntSizeUp,
      save: saveNotes,
    };
    noteMounts.push(mountObj);

    ntMaxBtn.addEventListener("click", () => showNotesMax(mountObj));
    ntClearBtn.addEventListener("click", () => {
      if (!ntText.value) return;
      if (!window.confirm(t("confirm_clear_notes"))) return;
      ntText.value = "";
      ntCount.textContent = "0";
      saveNotes("");
      if (activeNote && activeNote.iid === iid && ntTextMax) {
        ntTextMax.value = "";
        if (ntCountMax) ntCountMax.textContent = "0";
      }
    });
    if (ntSizeDown) ntSizeDown.addEventListener("click", () => bumpNotesSize(-2));
    if (ntSizeUp) ntSizeUp.addEventListener("click", () => bumpNotesSize(2));

    // Apply current size to this instance immediately
    ntText.style.fontSize = ntFontSize + "px";
    if (ntSizeReadout) ntSizeReadout.textContent = ntFontSize + "px";
    if (ntSizeDown) ntSizeDown.disabled = ntFontSize <= 12;
    if (ntSizeUp) ntSizeUp.disabled = ntFontSize >= 28;

    return {
      cleanup() {
        const i = noteMounts.indexOf(mountObj);
        if (i >= 0) noteMounts.splice(i, 1);
        if (activeNote === mountObj) {
          ntOverlay.classList.add("hidden");
          document.body.style.overflow = "";
          activeNote = null;
        }
      }
    };
  }

  // ---------- Tool manager ----------
  const ACTIVE_KEY = "event-tools-instances-v2";
  let nextIid = 1;

  function loadActiveInstances() {
    try {
      const raw = localStorage.getItem(ACTIVE_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          const valid = arr.filter(x => x && typeof x.iid === "number" && TOOL_TYPES.includes(x.type));
          if (valid.length > 0) {
            nextIid = Math.max.apply(null, valid.map(x => x.iid)) + 1;
            return valid;
          }
        }
      }
      // Migrate from v1
      const v1 = localStorage.getItem("event-tools-active-v1");
      if (v1) {
        const arr = JSON.parse(v1);
        if (Array.isArray(arr)) {
          const valid = arr.filter(t => TOOL_TYPES.includes(t));
          if (valid.length > 0) {
            const migrated = valid.map(tt => ({ iid: nextIid++, type: tt }));
            return migrated;
          }
        }
      }
    } catch (e) {}
    return [{ iid: nextIid++, type: "picker" }];
  }

  let activeInstances = loadActiveInstances();

  function persistActiveInstances() {
    try { localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeInstances)); } catch (e) {}
  }

  const toolsHost = document.getElementById("tools-host");
  const addToolEmpty = document.getElementById("add-tool-empty");
  const addToolBtn = document.getElementById("add-tool-btn");
  const addToolMenu = document.getElementById("add-tool-menu");

  function refreshEmptyHint() {
    if (addToolEmpty) addToolEmpty.classList.toggle("hidden", activeInstances.length > 0);
  }

  function mountInstance(inst, scrollTo) {
    const tpl = document.getElementById("tpl-" + inst.type);
    if (!tpl) return null;
    const section = tpl.content.firstElementChild.cloneNode(true);
    section.dataset.iid = String(inst.iid);
    toolsHost.appendChild(section);
    let api = {};
    if (inst.type === "picker") api = mountPicker(section) || {};
    else if (inst.type === "countdown") api = mountCountdown(section) || {};
    else if (inst.type === "poster") api = mountPoster(section) || {};
    else if (inst.type === "notes") api = mountNotes(section, inst.iid) || {};
    api.section = section;
    api.iid = inst.iid;
    api.type = inst.type;
    instances.push(api);
    const removeBtn = section.querySelector(".tool-remove");
    if (removeBtn) removeBtn.addEventListener("click", () => removeInstance(inst.iid));
    applyLangToTree(section);
    if (scrollTo) {
      requestAnimationFrame(() => {
        section.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
    return api;
  }

  function unmountInstance(iid) {
    const idx = instances.findIndex(i => i.iid === iid);
    if (idx < 0) return;
    const inst = instances[idx];
    if (inst.cleanup) inst.cleanup();
    if (inst.section && inst.section.parentNode) inst.section.parentNode.removeChild(inst.section);
    instances.splice(idx, 1);
  }

  function addInstance(type) {
    if (!TOOL_TYPES.includes(type)) return;
    const iid = nextIid++;
    activeInstances.push({ iid: iid, type: type });
    persistActiveInstances();
    mountInstance({ iid: iid, type: type }, true);
    refreshEmptyHint();
    closeAddMenu();
  }

  function removeInstance(iid) {
    activeInstances = activeInstances.filter(i => i.iid !== iid);
    persistActiveInstances();
    unmountInstance(iid);
    refreshEmptyHint();
  }

  function closeAddMenu() {
    if (addToolMenu) addToolMenu.classList.add("hidden");
  }
  if (addToolBtn) addToolBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (addToolMenu) addToolMenu.classList.toggle("hidden");
  });
  if (addToolMenu) addToolMenu.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => {
    if (addToolMenu && !addToolMenu.classList.contains("hidden")) closeAddMenu();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && addToolMenu && !addToolMenu.classList.contains("hidden")) closeAddMenu();
  });
  document.querySelectorAll("[data-add-tool]").forEach((btn) => {
    btn.addEventListener("click", () => addInstance(btn.dataset.addTool));
  });

  // Mount initial instances
  activeInstances.forEach(inst => mountInstance(inst, false));
  refreshEmptyHint();

  // Detect default language from browser
  try {
    const nav = (navigator.language || "en").toLowerCase();
    if (nav.startsWith("zh")) applyLanguage("zh");
    else applyLanguage("en");
  } catch (e) { applyLanguage("en"); }
})();
</script>
